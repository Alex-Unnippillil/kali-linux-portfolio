name: Integrate launcher regression fix
on:
  pull_request:
    paths: ['.github/workflows/launcher-repair.yml']
permissions:
  contents: write
jobs:
  fix:
    if: github.repository == 'Alex-Unnippillil/kali-linux-portfolio' && github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'engineering/portfolio-release-2026-09-17'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Apply exact reviewed edits
        run: |
          python3 <<'PY'
          from pathlib import Path
          import hashlib
          path = Path('components/menu/WhiskerMenu.tsx')
          old = path.read_bytes()
          assert hashlib.sha256(old).hexdigest() == '4d02a787c99f91ffd096af2c2a04dbdacd29d1430abde8dbf7199d0edc8ee448'
          block = b'          onBlur={(e) => {\r\n            if (!e.currentTarget.contains(e.relatedTarget as Node)) {\r\n              hideMenu();\r\n            }\r\n          }}\r\n'
          assert old.count(block) == 1
          new = old.replace(block, b'')
          assert hashlib.sha256(new).hexdigest() == 'cbacb305adc4e76237fa65a96c82964bc4a36d5e14feb63963846c3f475aafce'
          path.write_bytes(new)
          spec = Path('tests/portfolio/app-polish.spec.ts')
          text = spec.read_text()
          assert text.count("notes.getByRole('textbox')") == 2
          spec.write_text(text.replace("notes.getByRole('textbox')", "notes.getByRole('textbox', { name: 'Note text', exact: true })"))
          test = Path('__tests__/whiskerMenu.test.tsx')
          text = test.read_text()
          assert "WhiskerMenu dismissal" not in text
          test.write_text(text + '''
          describe('WhiskerMenu dismissal', () => {
            it('retains the menu during a transient focus loss and still closes on Escape', async () => {
              render(<WhiskerMenu />);
              fireEvent.keyDown(window, { key: 'F1', altKey: true });
              await screen.findByTestId('whisker-menu-dropdown');
              const search = screen.getByRole('searchbox', { name: 'Search applications' });
              fireEvent.blur(search, { relatedTarget: null });
              expect(screen.getByTestId('whisker-menu-dropdown')).toHaveClass('opacity-100');
              fireEvent.keyDown(document, { key: 'Escape' });
              await waitFor(() => expect(screen.queryByTestId('whisker-menu-dropdown')).not.toBeInTheDocument());
            });
            it('still dismisses when the pointer presses outside the launcher', async () => {
              render(<WhiskerMenu />);
              fireEvent.keyDown(window, { key: 'F1', altKey: true });
              await screen.findByTestId('whisker-menu-dropdown');
              fireEvent.mouseDown(document.body);
              await waitFor(() => expect(screen.queryByTestId('whisker-menu-dropdown')).not.toBeInTheDocument());
            });
          });
          ''')
          PY
          git diff --check
      - name: Commit only these edits, never overwrite concurrent work
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          branch='engineering/portfolio-release-2026-09-17'
          expected="$(git rev-parse HEAD)"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add components/menu/WhiskerMenu.tsx tests/portfolio/app-polish.spec.ts __tests__/whiskerMenu.test.tsx
          git commit -m '[desktop] preserve launcher during focus transitions and test note text precisely'
          git -c credential.helper='!f() { echo username=x-access-token; echo password="$GH_TOKEN"; }; f' fetch origin "$branch"
          test "$(git rev-parse FETCH_HEAD)" = "$expected"
          git -c credential.helper='!f() { echo username=x-access-token; echo password="$GH_TOKEN"; }; f' push origin "HEAD:refs/heads/$branch"
