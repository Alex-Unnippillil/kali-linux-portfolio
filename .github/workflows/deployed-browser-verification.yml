name: Exact Vercel browser verification
on:
  pull_request:
    paths: ['.github/workflows/deployed-browser-verification.yml']
permissions:
  contents: read
concurrency:
  group: exact-deployment-verification
  cancel-in-progress: true
jobs:
  deployed:
    if: github.head_ref == 'qa/deployed-kali-2026-09-17' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      PUPPETEER_SKIP_DOWNLOAD: 'true'
      BASE_URL: https://unnippillil.com
      EXPECTED_REVISION: c432e9a9fe11a434548ea0f9c0e8e11d11924097
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.EXPECTED_REVISION }}
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
      - run: corepack enable
      - uses: actions/cache@v4
        with:
          path: ~/.yarn/berry/cache
          key: yarn-${{ runner.os }}-${{ hashFiles('yarn.lock', '.nvmrc', '.yarnrc.yml') }}
      - run: yarn install --immutable
      - run: yarn playwright install --with-deps chromium
      - name: Verify exact production desktop and touch interactions
        env:
          VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
        run: |
          xvfb-run -a node <<'JS'
          const fs = require('node:fs');
          const assert = require('node:assert/strict');
          const { chromium } = require('playwright');
          (async () => {
            const expectedRevision = process.env.EXPECTED_REVISION;
            assert.match(expectedRevision || '', /^[a-f0-9]{40}$/);
            const baseUrl = new URL(process.env.BASE_URL);
            assert.equal(baseUrl.protocol, 'https:');
            const secret = process.env.VERCEL_AUTOMATION_BYPASS_SECRET;
            const browser = await chromium.launch({ headless: false });
            const results = [];
            fs.mkdirSync('deployed-evidence', { recursive: true });
            try {
              for (const phone of [false, true]) {
                const name = phone ? 'phone' : 'desktop';
                const result = { name, url: baseUrl.origin, expectedRevision, credentialAvailable: Boolean(secret), verified: false, pageErrors: [] };
                const context = await browser.newContext({
                  viewport: phone ? { width: 390, height: 844 } : { width: 1440, height: 900 },
                  isMobile: phone, hasTouch: phone, serviceWorkers: 'block',
                });
                await context.route('**/*', async route => {
                  const request = route.request();
                  const headers = { ...request.headers() };
                  delete headers['x-vercel-protection-bypass'];
                  delete headers['x-vercel-set-bypass-cookie'];
                  if (secret && new URL(request.url()).origin === baseUrl.origin) {
                    headers['x-vercel-protection-bypass'] = secret;
                    headers['x-vercel-set-bypass-cookie'] = 'true';
                  }
                  await route.continue({ headers });
                });
                await context.addInitScript(() => localStorage.setItem('boot:skip', '1'));
                const page = await context.newPage();
                page.setDefaultTimeout(20000);
                page.on('pageerror', error => result.pageErrors.push(error.message));
                const press = async locator => phone ? locator.tap() : locator.click();
                const openNotes = async () => {
                  await press(page.locator('#whisker-button'));
                  const menu = page.locator('#whisker-menu-dropdown');
                  await menu.getByRole('searchbox', { name: 'Search applications' }).fill('Sticky Notes');
                  await press(menu.getByRole('button', { name: 'Sticky Notes', exact: true }));
                  const notes = page.locator('#notes');
                  await notes.waitFor({ state: 'visible' });
                  return notes;
                };
                try {
                  const response = await page.goto(baseUrl.href, { waitUntil: 'domcontentloaded', timeout: 45000 });
                  result.initialStatus = response?.status();
                  await page.locator('#desktop').waitFor({ state: 'visible' });
                  result.actualRevision = await page.locator('meta[name="kali-build-revision"]').getAttribute('content');
                  assert.equal(result.actualRevision, expectedRevision, 'Wrong deployed revision');
                  const about = page.locator('#about');
                  await about.waitFor({ state: 'visible' });
                  if (phone) {
                    await page.waitForFunction(() => document.querySelector('#about')?.getAttribute('data-window-compact') === 'true');
                  } else {
                    await press(about.getByRole('button', { name: 'Window maximize', exact: true }));
                    await press(about.getByRole('button', { name: 'Restore window size', exact: true }));
                  }
                  const box = await about.boundingBox();
                  const viewport = page.viewportSize();
                  assert.ok(box && box.x >= -2 && box.y >= -2 && box.x + box.width <= viewport.width + 2 && box.y + box.height <= viewport.height + 2, 'Unreachable window bounds');
                  await page.screenshot({ path: `deployed-evidence/${name}-desktop.png` });
                  await press(about.getByRole('button', { name: 'Window close', exact: true }));
                  await about.waitFor({ state: 'hidden' });
                  let notes = await openNotes();
                  const draft = `Release verification ${expectedRevision.slice(0, 12)}`;
                  await notes.getByRole('textbox', { name: 'Note text', exact: true }).fill(draft);
                  await press(notes.getByRole('button', { name: 'Window close', exact: true }));
                  await notes.waitFor({ state: 'hidden' });
                  notes = await openNotes();
                  assert.equal(await notes.getByRole('textbox', { name: 'Note text', exact: true }).inputValue(), draft);
                  await page.screenshot({ path: `deployed-evidence/${name}-notes.png` });
                  assert.deepEqual(result.pageErrors, [], 'Uncaught browser errors');
                  result.verified = true;
                } catch (error) {
                  result.error = error.message;
                  process.exitCode = 1;
                } finally {
                  result.title = await page.title().catch(() => 'Unavailable');
                  await page.screenshot({ path: `deployed-evidence/${name}-final.png` }).catch(() => {});
                  results.push(result);
                  await context.close();
                }
              }
            } finally {
              fs.writeFileSync('deployed-evidence/result.json', JSON.stringify({ expectedRevision, results }, null, 2));
              console.log(JSON.stringify({ expectedRevision, results }, null, 2));
              await browser.close();
            }
          })().catch(error => { console.error(error.message); process.exitCode = 1; });
          JS
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: deployed-browser-evidence
          path: deployed-evidence
          retention-days: 7
          if-no-files-found: error
