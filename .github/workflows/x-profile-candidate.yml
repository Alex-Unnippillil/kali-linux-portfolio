name: Stage X browser and review repairs
on:
  push:
    branches: [qa/x-profile-2026-09-18]
    paths: [.github/workflows/x-profile-candidate.yml]
permissions:
  contents: write
jobs:
  candidate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 734e705725e14e678374fdb3da08443dc5dafa5f
      - name: Verify exact reviewed patch and scope
        run: |
          python3 <<'PY'
          import base64, hashlib, lzma, pathlib, subprocess
          encoded = ''''''
          raw = lzma.decompress(base64.b64decode(encoded, validate=True))
          assert hashlib.sha256(raw).hexdigest() == 'bcf1e7e0f4d664d087fecec074a5295a859bcc0b05bab7245c5f550826c0e673'
          patch = pathlib.Path('/tmp/x-polish.patch')
          patch.write_bytes(raw)
          allowed = {'.github/workflows/gh-deploy.yml', 'scripts/changed-files.mjs', '__tests__/lint-changed.test.ts', '__tests__/shell-overlay-layout.test.tsx', 'apps/x/profile.module.css', 'components/desktop/DesktopGuide.tsx', 'components/desktop/DesktopGuide.module.css', 'components/desktop/MobileTaskbar.module.css', 'components/menu/WhiskerMenu.tsx', 'tests/portfolio/x-profile.spec.ts'}
          paths = {line.split('\t')[-1] for line in subprocess.check_output(['git', 'apply', '--numstat', str(patch)]).decode().splitlines()}
          assert paths == allowed
          assert subprocess.check_output(['git', 'rev-parse', 'HEAD']).decode().strip() == '734e705725e14e678374fdb3da08443dc5dafa5f'
          subprocess.run(['git', 'apply', '--check', str(patch)], check=True)
          subprocess.run(['git', 'apply', str(patch)], check=True)
          subprocess.run(['git', 'add', '--all'], check=True)
          assert subprocess.check_output(['git', 'write-tree']).decode().strip() == 'fa17e765361f566e1f568cd6284f868ccba104b1'
          PY
      - name: Stage candidate without changing main or the PR branch
        run: |
          set -euo pipefail
          git -c core.whitespace=blank-at-eol,blank-at-eof,space-before-tab,cr-at-eol diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m '[x] repair phone overlay reachability and readable post links' -m 'Use reserved phone taskbar space for optional help; bound the launcher above taskbar and keyboard; underline inline post links and use readable system typography. Add four red/green overlay regressions and retain real browser hit-target, geometry and accessibility assertions. Also address the reviewed shallow-checkout lint base. No security settings, timeout or browser assertion relaxed; hosted release gate required.'
          git push origin HEAD:refs/heads/qa/x-profile-polished-2026-09-18
          git rev-parse HEAD
