name: Release source evidence
on:
  pull_request:
    paths: ['.github/workflows/release-source.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Archive tracked source and revision only
        run: |
          mkdir -p /tmp/release-source
          git rev-parse HEAD > /tmp/release-source/revision.txt
          git archive --format=tar.gz HEAD > /tmp/release-source/source.tar.gz
      - uses: actions/upload-artifact@v4
        with:
          name: release-source
          path: /tmp/release-source
          retention-days: 1
          if-no-files-found: error
