name: Integrate reviewed desktop restoration
on:
  pull_request:
    paths: ['.github/workflows/apply-desktop-release.yml']
permissions:
  contents: write
concurrency:
  group: portfolio-release-maintenance
  cancel-in-progress: false
jobs:
  integrate:
    if: github.repository == 'Alex-Unnippillil/kali-linux-portfolio' && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'engineering/portfolio-release-2026-09-17'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Apply exact locally tested source; refuse concurrent modifications
        run: |
          git merge-base --is-ancestor f26c58aa89debd4ffc23e5cd16573989a77eab33 HEAD
          python3 scripts/apply-desktop-release.py
          rm scripts/apply-desktop-release.py scripts/desktop-release-edits-{a,b,c,d}.json
          git restore -- .github/workflows/ci.yml .github/workflows/portfolio-browser.yml
          git diff --check
      - name: Commit only to the existing review branch, never force
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          branch='engineering/portfolio-release-2026-09-17'
          expected="$(git rev-parse HEAD)"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m '[desktop] restore OS entry, native project windows and responsive window geometry'
          git -c credential.helper='!f() { echo username=x-access-token; echo password="$GH_TOKEN"; }; f' fetch origin "$branch"
          test "$(git rev-parse FETCH_HEAD)" = "$expected" || { echo 'Branch advanced; refusing to overwrite concurrent work.'; exit 1; }
          git -c credential.helper='!f() { echo username=x-access-token; echo password="$GH_TOKEN"; }; f' push origin "HEAD:refs/heads/$branch"
