name: Stage native Command focus repair
on:
  push:
    branches: [qa/native-apps-source-2026-09-18]
    paths: [.github/workflows/native-command-focus-repair.yml]
permissions:
  contents: write
jobs:
  stage:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 0033ac9c7b065a3cc92ab05811aa0cffb74b4cdd
      - name: Verify bounded patch and exact resulting source tree
        run: |
          python3 - <<'PY'
          import base64,gzip,hashlib,pathlib,subprocess
          encoded=''
          patch=gzip.decompress(base64.b64decode(encoded,validate=True))
          assert hashlib.sha256(patch).hexdigest()=='e796d010f8998f4a8a827414ee6b66adf1f9ea72ceab402244d51c41d3d44261'
          pathlib.Path('/tmp/keyboard.patch').write_bytes(patch)
          pathlib.Path('.git/info/attributes').write_text('* -text\n')
          subprocess.run(['git','apply','--check','/tmp/keyboard.patch'],check=True)
          subprocess.run(['git','apply','/tmp/keyboard.patch'],check=True)
          paths=['__tests__/desktop.listeners.test.tsx','components/screen/desktop.js','tests/portfolio/repository-editor.spec.ts']
          subprocess.run(['git','add','--',*paths],check=True)
          assert subprocess.check_output(['git','diff','--cached','--name-only']).decode().splitlines()==paths
          assert subprocess.check_output(['git','write-tree']).decode().strip()=='454f430f6e77377d9dafe76f1738f7d0b569bd72'
          PY
      - name: Store reviewed objects on isolated branch only
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git -c core.whitespace=cr-at-eol diff --cached --check
          git commit -m 'fix(desktop): stage native Command focus repair and keyboard regressions'
          git push origin HEAD:refs/heads/qa/native-keyboard-454f430
