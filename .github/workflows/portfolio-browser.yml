name: Pinball browser diagnostics
on:
  push:
    branches: [codex/pinball-browser-diagnostics-20260922]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pinball-diagnostic-${{ github.ref }}
  cancel-in-progress: true
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      NEXT_TELEMETRY_DISABLED: '1'
      PUPPETEER_SKIP_DOWNLOAD: 'true'
      NEXT_PUBLIC_VERCEL_ENV: preview
      VERCEL_ENV: preview
      NODE_OPTIONS: --max-old-space-size=4096
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: Record exact diagnostic sources
        env:
          EXPECTED_HEAD: ${{ github.sha }}
        run: |
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          {
            echo "Tested commit: $(git rev-parse HEAD)"
            echo "Tested tree: $(git rev-parse HEAD^{tree})"
            git ls-files -s apps/pinball tests/portfolio/pinball-app-polish.spec.ts
          } | tee validation-source.txt
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
      - run: corepack enable
      - uses: actions/cache@v4
        with:
          path: ~/.yarn/berry/cache
          key: yarn-${{ runner.os }}-${{ hashFiles('yarn.lock', '.nvmrc', '.yarnrc.yml') }}
      - run: yarn install --immutable
      - run: yarn playwright install --with-deps chromium firefox webkit
      - run: yarn build
      - run: |
          set -o pipefail
          yarn playwright test --config=playwright.portfolio.config.ts pinball-app-polish 2>&1 | tee pinball-browser.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pinball-browser-diagnostic
          path: |
            validation-source.txt
            pinball-browser.log
            portfolio-screenshots
            portfolio-browser-report
            test-results
          if-no-files-found: warn
          retention-days: 7
