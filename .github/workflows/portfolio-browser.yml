name: Kali desktop browser QA
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: portfolio-browser-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      NEXT_TELEMETRY_DISABLED: '1'
      PUPPETEER_SKIP_DOWNLOAD: 'true'
      NEXT_PUBLIC_VERCEL_ENV: preview
      VERCEL_ENV: preview
      NODE_OPTIONS: --max-old-space-size=4096
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - name: Verify requested revision and integrate the exact PR base
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
          EXPECTED_BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          if [ -n "$EXPECTED_BASE" ] && ! git merge-base --is-ancestor "$EXPECTED_BASE" HEAD; then
            git config user.name 'CI validation'
            git config user.email 'ci-validation@users.noreply.github.com'
            git merge --no-edit "$EXPECTED_BASE"
          fi
          {
            echo "Requested head: $EXPECTED_HEAD"
            echo "Requested base: $EXPECTED_BASE"
            echo "Tested commit: $(git rev-parse HEAD)"
            echo "Tested tree: $(git rev-parse HEAD^{tree})"
            git ls-files -s hooks/useSettings.tsx components/screen/navbar.js
          } | tee validation-source.txt
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
      - run: corepack enable
      - uses: actions/cache@v4
        with:
          path: ~/.yarn/berry/cache
          key: yarn-${{ runner.os }}-${{ hashFiles('yarn.lock', '.nvmrc', '.yarnrc.yml') }}
      - run: yarn install --immutable
      - run: yarn playwright install --with-deps chromium firefox webkit
      - run: yarn build
      - run: yarn playwright test --config=playwright.portfolio.config.ts
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: portfolio-browser-evidence
          path: |
            validation-source.txt
            portfolio-screenshots
            portfolio-browser-report
            test-results
          if-no-files-found: warn
          retention-days: 7
