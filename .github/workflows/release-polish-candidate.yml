name: Stage tested release polish
on:
  push:
    branches: [qa/deployed-kali-2026-09-17]
    paths: [qa/scroll-layout.b64, .github/workflows/release-polish-candidate.yml]
permissions:
  contents: write
jobs:
  candidate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          path: payload
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: e774c02ad98d3acb55c83322ea42f0d26b2acf7f
          path: source
      - name: Verify exact reviewed scroll-layout patch
        run: |
          python3 - <<'PY'
          import base64, hashlib, lzma, pathlib, subprocess
          raw = lzma.decompress(base64.b64decode(pathlib.Path('payload/qa/scroll-layout.b64').read_text()))
          assert hashlib.sha256(raw).hexdigest() == 'a3602bc195a8b518f6456c81aaeba4cd6a232f8f9b245fd0e2c6fa3bc52e325e'
          pathlib.Path('/tmp/release.patch').write_bytes(raw)
          assert subprocess.check_output(['git', '-C', 'source', 'rev-parse', 'HEAD']).decode().strip() == 'e774c02ad98d3acb55c83322ea42f0d26b2acf7f'
          allowed = {'styles/index.css', 'components/base/window.module.css', 'components/apps/youtube/index.tsx', 'components/apps/youtube/youtube.module.css', 'tests/portfolio/youtube-responsive.spec.ts', 'utils/scrollWithinContainer.ts', '__tests__/scroll-within-container.test.ts'}
          paths = {line.split('\t')[-1] for line in subprocess.check_output(['git', '-C', 'source', 'apply', '--numstat', '/tmp/release.patch']).decode().splitlines()}
          assert paths == allowed
          subprocess.run(['git', '-C', 'source', 'apply', '--check', '/tmp/release.patch'], check=True)
          subprocess.run(['git', '-C', 'source', 'apply', '/tmp/release.patch'], check=True)
          PY
      - name: Stage scroll containment fix without changing main
        working-directory: source
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add --all
          git diff --cached --check
          git commit -m 'fix(layout): contain app scrolling and remove legacy full-window blur' -m 'Give app hosts a definite remaining flex height, prevent programmatic scrolling of window chrome, and scroll only the YouTube content panel. Add layout geometry assertions and three local-scroll regressions. Preserve context-menu glass and all release gates.'
          git push origin HEAD:refs/heads/qa/scroll-layout-a3602bc
          git rev-parse HEAD
