name: Settings development tooling
on:
  push:
    branches: [feat/settings-control-center]
    paths: [.github/workflows/settings-development.yml]
permissions:
  contents: read
  actions: read
jobs:
  focus-diagnostic:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PUPPETEER_SKIP_DOWNLOAD: 'true'
      NEXT_TELEMETRY_DISABLED: '1'
      NEXT_PUBLIC_VERCEL_ENV: preview
      VERCEL_ENV: preview
      NODE_OPTIONS: --max-old-space-size=4096
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Retrieve the already inspected candidate artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api repos/Alex-Unnippillil/kali-linux-portfolio/actions/artifacts/10697457480/zip > "$RUNNER_TEMP/candidate.zip"
          echo "f96a727f39ef5f5d601c29a24193a33e96b82ea5c1083e4b7c3d0554b6fc551c  $RUNNER_TEMP/candidate.zip" | sha256sum --check
      - name: Load only the reviewed source and temporary test instrumentation
        shell: python
        run: |
          import os, zipfile, tarfile, io, subprocess
          from pathlib import Path
          assert subprocess.check_output(['git','rev-parse','HEAD^'],text=True).strip()=='e22a1bb668e618f1d6ea2cb69cfe0a9e8e7d1888'
          z=zipfile.ZipFile(os.environ['RUNNER_TEMP']+'/candidate.zip')
          assert z.read('settings-validation/revision.txt').decode().strip()=='bdfe098982894abc71f8f7f4cdea720c71927d85'
          t=tarfile.open(fileobj=io.BytesIO(z.read('settings-validation/source.tar.gz')))
          for name in ['components/util-components/clock.js','components/apps/settings/SettingsCenter.module.css','styles/globals.css','playwright.portfolio.config.ts','tests/portfolio/settings-control-center.spec.ts','data/repository-source-catalog.json']:
            Path(name).write_bytes(t.extractfile(name).read())
          p=Path('tests/portfolio/settings-control-center.spec.ts'); s=p.read_text()
          needle='  await page.clock.install({ time: new Date("2026-09-22T13:04:05Z") });'
          assert s.count(needle)==1
          s=s.replace(needle,needle+'''
            await page.addInitScript(() => {
              const logs: unknown[] = [];
              (window as any).__focusDiagnostics = logs;
              const describe = (el: any) => el instanceof HTMLElement ? {
                tag: el.tagName, label: el.getAttribute("aria-label"), text: el.textContent?.slice(0,80),
                visibility: getComputedStyle(el).visibility, display: getComputedStyle(el).display,
                connected: el.isConnected, inert: !!el.closest("[inert]"),
              } : null;
              const native = HTMLElement.prototype.focus;
              HTMLElement.prototype.focus = function (...args) {
                const record = { target: describe(this), before: describe(document.activeElement), stack: new Error().stack, after: null as any };
                native.apply(this,args);
                record.after = describe(document.activeElement);
                logs.push(record);
              };
              document.addEventListener("focusin", e => logs.push({ event: "focusin", target: describe(e.target) }));
            });
          ''')
          s+='''
          test.afterEach(async ({ page }, info) => {
            if (info.status === info.expectedStatus) return;
            await info.attach("focus-diagnostics", { body: JSON.stringify(await page.evaluate(() => (window as any).__focusDiagnostics), null, 2), contentType: "application/json" });
          });
          '''
          p.write_text(s)
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
      - run: corepack enable
      - uses: actions/cache@v4
        with:
          path: ~/.yarn/berry/cache
          key: yarn-${{ runner.os }}-${{ hashFiles('yarn.lock', '.nvmrc', '.yarnrc.yml') }}
      - run: yarn install --immutable
      - run: yarn playwright install --with-deps chromium
      - run: yarn build
      - run: yarn playwright test --config=playwright.portfolio.config.ts settings-control-center.spec.ts --project=chromium --grep 'desktop settings affect real'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: settings-focus-diagnostics
          path: |
            portfolio-browser-report/
            test-results/
          if-no-files-found: error
          retention-days: 1
