name: Settings development tooling
on:
  push:
    branches: [feat/settings-control-center]
    paths: [.github/workflows/settings-development.yml]
permissions:
  contents: read
jobs:
  tooling:
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Capture tracked source and revision only
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/settings-source"
          git bundle create "$RUNNER_TEMP/settings-source/source.bundle" HEAD
          git rev-parse HEAD > "$RUNNER_TEMP/settings-source/revision.txt"
          git rev-parse HEAD^{tree} > "$RUNNER_TEMP/settings-source/tree.txt"
          sha256sum "$RUNNER_TEMP/settings-source/source.bundle" > "$RUNNER_TEMP/settings-source/SHA256SUMS"
      - uses: actions/upload-artifact@v4
        with:
          name: settings-continuation-source
          path: ${{ runner.temp }}/settings-source/
          retention-days: 2
          if-no-files-found: error
