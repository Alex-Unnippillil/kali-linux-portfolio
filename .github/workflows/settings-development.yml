name: Settings development tooling
on:
  push:
    branches: [feat/settings-control-center]
    paths: [.github/workflows/settings-development.yml]
permissions:
  contents: read
jobs:
  tooling:
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    env:
      PUPPETEER_SKIP_DOWNLOAD: 'true'
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
      - run: corepack enable
      - uses: actions/cache@v4
        with:
          path: ~/.yarn/berry/cache
          key: yarn-${{ runner.os }}-${{ hashFiles('yarn.lock', '.nvmrc', '.yarnrc.yml') }}
      - run: yarn install --immutable
      - name: Capture source-bound local validation tools without credentials
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/settings-toolchain"
          cp "$(command -v node)" "$RUNNER_TEMP/settings-toolchain/node"
          tar -czf "$RUNNER_TEMP/settings-toolchain/dependencies.tar.gz" node_modules .yarn/install-state.gz
          git rev-parse HEAD > "$RUNNER_TEMP/settings-toolchain/revision.txt"
          sha256sum yarn.lock > "$RUNNER_TEMP/settings-toolchain/lockfile.sha256"
          git bundle create "$RUNNER_TEMP/settings-toolchain/source.bundle" HEAD
      - uses: actions/upload-artifact@v4
        with:
          name: settings-locked-toolchain
          path: ${{ runner.temp }}/settings-toolchain/
          retention-days: 1
          if-no-files-found: error
