name: Settings development tooling
on:
  push:
    branches: [feat/settings-control-center]
    paths: [.github/workflows/settings-development.yml]
permissions:
  contents: write
  actions: write
concurrency:
  group: settings-release-repair
  cancel-in-progress: false
jobs:
  release-candidate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PUPPETEER_SKIP_DOWNLOAD: 'true'
      NEXT_TELEMETRY_DISABLED: '1'
      NEXT_PUBLIC_VERCEL_ENV: preview
      VERCEL_ENV: preview
      NODE_OPTIONS: --max-old-space-size=4096
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
      - run: corepack enable
      - uses: actions/cache@v4
        with:
          path: ~/.yarn/berry/cache
          key: yarn-${{ runner.os }}-${{ hashFiles('yarn.lock', '.nvmrc', '.yarnrc.yml') }}
      - run: yarn install --immutable
      - name: Apply reviewed desktop and browser regressions
        shell: python
        run: |
          import subprocess
          from pathlib import Path
          assert subprocess.check_output(['git','rev-parse','HEAD^'],text=True).strip()=='bec99c918ef672567a64fbcf1177d48a5eac35fb'
          for name, expected in {
            '__tests__/settings-reset.test.tsx':'44ac54eb131480a3a73d1f8ea81445be98a1cf67',
            'docs/settings-control-center.md':'45c4654f39d771f06c0fa8a556ba754f1a9e8564',
            'tests/portfolio/settings-control-center.spec.ts':'623b2cdd407d5965aed68f03b912f2a161c2f764'
          }.items():
            assert subprocess.check_output(['git','hash-object',name],text=True).strip()==expected, f'{name}: reconcile changed source'
          def edit(s, old, new):
            assert s.count(old)==1, f'Expected one source match: {old[:100]}'
            return s.replace(old,new)
          p=Path('components/util-components/clock.js'); s=p.read_text()
          s=edit(s,'    hour12: hour12Prop,\n','')
          s=edit(s,"workspacePreferences.clockFormat === 'system' ? hour12Prop :", "workspacePreferences.clockFormat === 'system' ? undefined :")
          s=edit(s,'    const [popoverStyles, setPopoverStyles] = useState({})', "    const [popoverStyles, setPopoverStyles] = useState({})\n    const popoverPositioned = typeof popoverStyles.top === 'number'")
          s=edit(s,'    useEffect(() => {\n        if (!isOpen || !currentTime) return\n        setViewDate(new Date(currentTime.getFullYear(), currentTime.getMonth(), 1))\n        setFocusedDate(currentTime)\n    }, [isOpen, currentTime])','    // Start at today when opened, not on each clock tick. Navigation and keyboard\n    // focus must remain stable while seconds, midnight, or visibility change.\n    useEffect(() => {\n        if (!isOpen) return\n        const today = new Date()\n        setViewDate(new Date(today.getFullYear(), today.getMonth(), 1))\n        setFocusedDate(today)\n    }, [isOpen])')
          s=edit(s,'    useEffect(() => {\n        if (!isOpen) return\n        if (activeCellRef.current) {\n            activeCellRef.current.focus({ preventScroll: prefersReducedMotion })\n        }\n    }, [isOpen, viewDate, focusedDate, prefersReducedMotion])','    useEffect(() => {\n        // The portal is hidden until measured. Focus only after its visible commit;\n        // a position change alone must not steal focus from month controls.\n        if (!isOpen || !popoverPositioned) return\n        if (activeCellRef.current) {\n            activeCellRef.current.focus({ preventScroll: prefersReducedMotion })\n        }\n    }, [isOpen, popoverPositioned, viewDate, focusedDate, prefersReducedMotion])')
          s=edit(s,"visibility: typeof popoverStyles.top === 'number' ? 'visible' : 'hidden'", "visibility: popoverPositioned ? 'visible' : 'hidden'")
          s=edit(s,"                weekday: 'long',\n                month: 'long',\n                day: 'numeric'", "                weekday: 'long',\n                month: 'long',\n                day: 'numeric',\n                year: 'numeric'")
          s=edit(s,'                                            onClick={handleDayClick}', '                                            aria-label={friendlyDateFormatter.format(date)}\n                                            onClick={handleDayClick}')
          s=edit(s,'<div className="flex flex-col" aria-live="polite" id={headingId}>','<div className="flex flex-col">')
          s=edit(s,'<span className="text-base font-semibold tracking-tight text-white">{headingLabel}</span>','<span id={headingId} aria-live="polite" className="text-base font-semibold tracking-tight text-white">{headingLabel}</span>')
          s=edit(s,'<span className={textClassName} aria-live="polite">','<span className={textClassName}>')
          p.write_bytes(s.replace('\n','\r\n').encode())
          p=Path('styles/globals.css'); s=p.read_text()
          assert 'html[data-reduce-transparency="true"] {' not in s
          s+='''

          /* Browser-local accessibility preferences apply to desktop surfaces, including
             portaled menus and previews, not just the Settings window. */
          html[data-reduce-transparency="true"] {
            --color-surface-muted-alpha: 1;
            --color-surface-raised-alpha: 1;
            --color-overlay-strong-alpha: 1;
            --color-overlay-soft-alpha: 1;
            --kali-panel-alpha: 1;
            --kali-bg-alpha: 1;
          }
          html[data-reduce-transparency="true"] :is(
            .main-navbar-vp, .glass, .glass-subtle,
            [aria-label="Phone taskbar"], [data-testid="whisker-menu-dropdown"],
            [role="menu"], [role="dialog"], [data-window-titlebar]
          ) {
            background-color: var(--color-surface, #111b24) !important;
            background-image: none !important;
            -webkit-backdrop-filter: none !important;
            backdrop-filter: none !important;
          }
          html[data-strong-focus="true"] :focus-visible {
            outline: 3px solid #ffffff !important;
            outline-offset: 3px !important;
            box-shadow: 0 0 0 6px #07111e !important;
          }
          @media (forced-colors: active) {
            html[data-strong-focus="true"] :focus-visible {
              outline-color: Highlight !important;
              box-shadow: none !important;
            }
          }
          '''
          p.write_text(s)
          p=Path('components/apps/settings/SettingsCenter.module.css'); s=p.read_text()
          s=edit(s,'  .mobileNav {\n    display: block;\n    grid-column: 2;\n    grid-row: 1;\n  }\n  .mobileNav select {','  .mobileNav {\n    display: block;\n    position: relative;\n    grid-column: 2;\n    grid-row: 1;\n  }\n  .mobileNav::after {\n    content: "";\n    position: absolute;\n    pointer-events: none;\n    right: 13px;\n    top: calc(50% - 4px);\n    width: 7px;\n    height: 7px;\n    border-right: 2px solid #b6c4d6;\n    border-bottom: 2px solid #b6c4d6;\n    transform: rotate(45deg);\n  }\n  .mobileNav select {')
          s=edit(s,'    color: #e0eaf6;\n    background: #1d2b3c;','    appearance: none;\n    -webkit-appearance: none;\n    color-scheme: dark;\n    color: #e0eaf6;\n    background: #1d2b3c;')
          s=edit(s,'    padding: 8px 6px;\n    font-size: 0.69rem;','    padding: 8px 32px 8px 10px;\n    font-size: 0.69rem;')
          p.write_text(s)
          p=Path('tests/portfolio/settings-control-center.spec.ts'); s=p.read_text()
          s=edit(s,'  await expect(app.getByRole("combobox", { name: "Settings category" })).toBeVisible();\n  await screenshot(page, browserName, "overview-phone");','  const mobileCategory = app.getByRole("combobox", { name: "Settings category" });\n  await expect(mobileCategory).toBeVisible();\n  await expect(mobileCategory).toHaveCSS("appearance", "none");\n  await expect(mobileCategory).toHaveCSS("color-scheme", "dark");\n  await expect(mobileCategory).toHaveCSS("background-color", "rgb(29, 43, 60)");\n  await expect(mobileCategory).toHaveCSS("color", "rgb(224, 234, 246)");\n  await screenshot(page, browserName, "overview-phone");')
          s=edit(s,'  await screenshot(page, browserName, "display-phone-large-text");\n  await page.setViewportSize', '''  await screenshot(page, browserName, "display-phone-large-text");
            const largeTextAccessibility = await new AxeBuilder({ page }).include('[data-testid="settings-center"]').withTags(["wcag2a", "wcag2aa", "wcag21aa"]).analyze();
            expect(largeTextAccessibility.violations).toEqual([]);
            await page.setViewportSize''')
          s=edit(s,'  const selectedDate = await selectedDay.getAttribute("aria-label");\n  const previousTime','  const selectedDate = await selectedDay.getAttribute("aria-label");\n  expect(selectedDate).toBe("Thursday, October 22, 2026");\n  const previousTime')
          p.write_text(s)
          p=Path('playwright.portfolio.config.ts'); s=p.read_text()
          assert s.count('(?:youtube-responsive|')==2
          p.write_text(s.replace('(?:youtube-responsive|','(?:settings-control-center|youtube-responsive|'))
      - name: Commit final tracked candidate before source validation
        run: |
          set -euo pipefail
          git rm .github/workflows/settings-development.yml
          node scripts/generate-repository-snapshot.mjs --catalog
          git add components/util-components/clock.js components/apps/settings/SettingsCenter.module.css styles/globals.css playwright.portfolio.config.ts tests/portfolio/settings-control-center.spec.ts data/repository-source-catalog.json
          git -c core.whitespace=cr-at-eol diff --cached --check
          git config user.name 'Alex Unnippillil repository automation'
          git config user.email '24538548+Alex-Unnippillil@users.noreply.github.com'
          git commit -m 'fix(settings): finish accessible desktop controls and calendar focus lifecycle'
      - name: Check complete Settings release scope
        run: |
          set -euo pipefail
          env GITHUB_EVENT_NAME=workflow_dispatch GITHUB_BASE_REF=main yarn lint
          yarn typecheck
          node scripts/generate-repository-snapshot.mjs
          node --test tests/node/showcase-scripts.test.mjs
          yarn test __tests__/settings-center.test.tsx __tests__/settings-hydration.test.tsx __tests__/settings-model.test.ts __tests__/settings-reset.test.tsx --runInBand
      - run: yarn playwright install --with-deps chromium firefox webkit
      - run: yarn build
      - name: Validate Settings production-browser scenarios
        run: yarn playwright test --config=playwright.portfolio.config.ts settings-control-center.spec.ts
      - name: Fast-forward feature branch and run complete release gates
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_HEAD: ${{ github.sha }}
        run: |
          set -euo pipefail
          test "$(git ls-remote origin refs/heads/feat/settings-control-center | cut -f1)" = "$EXPECTED_HEAD"
          git push origin HEAD:refs/heads/feat/settings-control-center
          gh workflow run ci.yml --ref feat/settings-control-center
          gh workflow run portfolio-browser.yml --ref feat/settings-control-center
      - name: Preserve source identity and browser evidence
        if: always()
        run: |
          mkdir -p settings-validation
          git rev-parse HEAD > settings-validation/revision.txt
          git rev-parse HEAD^{tree} > settings-validation/tree.txt
          git status --porcelain > settings-validation/worktree.txt
          git diff HEAD > settings-validation/uncommitted.patch
          git archive --format=tar.gz HEAD > settings-validation/source.tar.gz
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: settings-release-validation
          path: |
            settings-validation/
            portfolio-browser-report/
            portfolio-screenshots/
            test-results/
          if-no-files-found: error
          retention-days: 3
