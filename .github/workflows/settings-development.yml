name: Settings development tooling
on:
  push:
    branches: [feat/settings-control-center]
    paths: [.github/workflows/settings-development.yml]
permissions:
  contents: write
  actions: write
concurrency:
  group: settings-release-repair
  cancel-in-progress: false
jobs:
  release-candidate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PUPPETEER_SKIP_DOWNLOAD: 'true'
      NEXT_TELEMETRY_DISABLED: '1'
      NEXT_PUBLIC_VERCEL_ENV: preview
      VERCEL_ENV: preview
      NODE_OPTIONS: --max-old-space-size=4096
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: Retrieve the inspected source-bound candidate
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api repos/Alex-Unnippillil/kali-linux-portfolio/actions/artifacts/10697457480/zip > "$RUNNER_TEMP/candidate.zip"
          echo "f96a727f39ef5f5d601c29a24193a33e96b82ea5c1083e4b7c3d0554b6fc551c  $RUNNER_TEMP/candidate.zip" | sha256sum --check
      - name: Preserve the reviewed tree and fix the measured visibility transition
        shell: python
        run: |
          import os, zipfile, tarfile, io, subprocess
          from pathlib import Path
          assert subprocess.check_output(['git','rev-parse','HEAD^'],text=True).strip()=='863ed33fa373ee7409932fd4dfc5ef2aaf4d2cad'
          assert subprocess.check_output(['git','diff','--name-only','e22a1bb668e618f1d6ea2cb69cfe0a9e8e7d1888','HEAD'],text=True).strip()=='.github/workflows/settings-development.yml'
          z=zipfile.ZipFile(os.environ['RUNNER_TEMP']+'/candidate.zip')
          assert z.read('settings-validation/revision.txt').decode().strip()=='bdfe098982894abc71f8f7f4cdea720c71927d85'
          t=tarfile.open(fileobj=io.BytesIO(z.read('settings-validation/source.tar.gz')))
          paths=['components/util-components/clock.js','components/apps/settings/SettingsCenter.module.css','styles/globals.css','playwright.portfolio.config.ts','tests/portfolio/settings-control-center.spec.ts','data/repository-source-catalog.json']
          for name in paths:
            Path(name).write_bytes(t.extractfile(name).read())
          subprocess.run(['git','rm','.github/workflows/settings-development.yml'],check=True)
          subprocess.run(['git','add',*paths],check=True)
          assert subprocess.check_output(['git','write-tree'],text=True).strip()=='4575ed64ef18a825572650970f3fbe133f1cc045', 'Reconstructed source differs from inspected candidate'
          p=Path('components/util-components/clock.js'); s=p.read_text()
          old="            ...popoverStyles,\n            visibility: popoverPositioned ? 'visible' : 'hidden'"
          new="            ...popoverStyles,\n            // Visibility must change immediately before focus; only visual properties\n            // may transition, otherwise the first focused day remains hidden at t=0.\n            transitionProperty: 'opacity, transform',\n            visibility: popoverPositioned ? 'visible' : 'hidden'"
          assert s.count(old)==1
          p.write_bytes(s.replace(old,new).replace('\n','\r\n').encode())
          p=Path('tests/portfolio/settings-control-center.spec.ts');s=p.read_text()
          old='  await expect(calendar).toHaveCSS("backdrop-filter", "none");'
          assert s.count(old)==1
          p.write_text(s.replace(old,old+'\n  await expect(calendar).toHaveCSS("transition-property", "opacity, transform");'))
          subprocess.run(['git','add',*paths],check=True)
          subprocess.run(['git','-c','core.whitespace=cr-at-eol','diff','--cached','--check'],check=True)
          subprocess.run(['git','config','user.name','Alex Unnippillil repository automation'],check=True)
          subprocess.run(['git','config','user.email','24538548+Alex-Unnippillil@users.noreply.github.com'],check=True)
          subprocess.run(['git','commit','-m','fix(settings): finish accessible configuration center and stable calendar focus'],check=True)
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
      - run: corepack enable
      - uses: actions/cache@v4
        with:
          path: ~/.yarn/berry/cache
          key: yarn-${{ runner.os }}-${{ hashFiles('yarn.lock', '.nvmrc', '.yarnrc.yml') }}
      - run: yarn install --immutable
      - name: Check complete Settings release scope
        run: |
          set -euo pipefail
          env GITHUB_EVENT_NAME=workflow_dispatch GITHUB_BASE_REF=main yarn lint
          yarn typecheck
          node scripts/generate-repository-snapshot.mjs
          node --test tests/node/showcase-scripts.test.mjs
          yarn test __tests__/settings-center.test.tsx __tests__/settings-hydration.test.tsx __tests__/settings-model.test.ts __tests__/settings-reset.test.tsx --runInBand
      - run: yarn playwright install --with-deps chromium firefox webkit
      - run: yarn build
      - name: Validate all Settings production-browser scenarios
        run: yarn playwright test --config=playwright.portfolio.config.ts settings-control-center.spec.ts
      - name: Fast-forward feature branch and run complete release gates
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_HEAD: ${{ github.sha }}
        run: |
          set -euo pipefail
          test "$(git ls-remote origin refs/heads/feat/settings-control-center | cut -f1)" = "$EXPECTED_HEAD"
          git push origin HEAD:refs/heads/feat/settings-control-center
          gh workflow run ci.yml --ref feat/settings-control-center
          gh workflow run portfolio-browser.yml --ref feat/settings-control-center
      - name: Preserve exact source and browser evidence
        if: always()
        run: |
          mkdir -p settings-validation
          git rev-parse HEAD > settings-validation/revision.txt
          git rev-parse HEAD^{tree} > settings-validation/tree.txt
          git status --porcelain > settings-validation/worktree.txt
          git diff HEAD > settings-validation/uncommitted.patch
          git archive --format=tar.gz HEAD > settings-validation/source.tar.gz
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: settings-release-validation
          path: |
            settings-validation/
            portfolio-browser-report/
            portfolio-screenshots/
            test-results/
          if-no-files-found: error
          retention-days: 3
