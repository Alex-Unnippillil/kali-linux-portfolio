name: Settings development tooling
on:
  push:
    branches: [feat/settings-control-center]
    paths: [.github/workflows/settings-development.yml]
permissions:
  contents: write
  actions: write
concurrency:
  group: settings-release-repair
  cancel-in-progress: false
jobs:
  release-candidate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PUPPETEER_SKIP_DOWNLOAD: 'true'
      NEXT_TELEMETRY_DISABLED: '1'
      NEXT_PUBLIC_VERCEL_ENV: preview
      NODE_OPTIONS: --max-old-space-size=4096
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: Apply checksum-bound reviewed changes
        shell: python
        run: |
          import base64, gzip, hashlib, subprocess
          from pathlib import Path
          expected='d88c065d9077e7c117b246a0b1c9790560158c3a'
          assert subprocess.check_output(['git','rev-parse','HEAD^'],text=True).strip()==expected, 'Reconcile changed source before applying this patch'
          encoded='  '
          patch=gzip.decompress(base64.b64decode(encoded))
          assert hashlib.sha256(patch).hexdigest()=='aa17e2fec8a5ddaca215c3244032765e8073a6b80de63f2c62237a7bad621aed', 'Patch transfer integrity failed'
          dest=Path('/tmp/settings-release.patch');dest.write_bytes(patch)
          subprocess.run(['git','apply','--check',str(dest)],check=True)
          subprocess.run(['git','apply',str(dest)],check=True)
          subprocess.run(['git','rm','.github/workflows/settings-development.yml'],check=True)
          subprocess.run(['git','add','__tests__/settings-reset.test.tsx','components/util-components/clock.js','styles/globals.css','playwright.portfolio.config.ts','tests/portfolio/settings-control-center.spec.ts','docs/settings-control-center.md','data/repository-source-catalog.json'],check=True)
          tree=subprocess.check_output(['git','write-tree'],text=True).strip()
          assert tree=='a1e44fb62c8ae85add3a8306f6aa9f1bdd4b52a4', 'Candidate tree differs from reviewed local source'
          subprocess.run(['git','config','user.name','Alex Unnippillil repository automation'],check=True)
          subprocess.run(['git','config','user.email','24538548+Alex-Unnippillil@users.noreply.github.com'],check=True)
          subprocess.run(['git','commit','-m','fix(settings): complete accessible desktop integrations and configuration regressions'],check=True)
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
      - run: corepack enable
      - uses: actions/cache@v4
        with:
          path: ~/.yarn/berry/cache
          key: yarn-${{ runner.os }}-${{ hashFiles('yarn.lock', '.nvmrc', '.yarnrc.yml') }}
      - run: yarn install --immutable
      - name: Check the entire Settings release scope
        run: |
          set -euo pipefail
          env GITHUB_EVENT_NAME=workflow_dispatch GITHUB_BASE_REF=main yarn lint
          yarn typecheck
          node scripts/generate-repository-snapshot.mjs
          node --test tests/node/showcase-scripts.test.mjs
          yarn test __tests__/settings-center.test.tsx __tests__/settings-hydration.test.tsx __tests__/settings-model.test.ts __tests__/settings-reset.test.tsx --runInBand
      - run: yarn playwright install --with-deps chromium firefox webkit
      - run: yarn build
      - name: Validate new Settings flows before publishing candidate
        run: yarn playwright test --config=playwright.portfolio.config.ts settings-control-center.spec.ts
      - name: Fast-forward feature branch and run complete release gates
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_HEAD: ${{ github.sha }}
        run: |
          set -euo pipefail
          test "$(git ls-remote origin refs/heads/feat/settings-control-center | cut -f1)" = "$EXPECTED_HEAD"
          git push origin HEAD:refs/heads/feat/settings-control-center
          gh workflow run ci.yml --ref feat/settings-control-center
          gh workflow run portfolio-browser.yml --ref feat/settings-control-center
      - name: Preserve exact source identity
        if: always()
        run: |
          mkdir -p settings-validation
          git rev-parse HEAD > settings-validation/revision.txt
          git rev-parse HEAD^{tree} > settings-validation/tree.txt
          git status --porcelain > settings-validation/worktree.txt
          git archive --format=tar.gz HEAD > settings-validation/source.tar.gz
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: settings-release-validation
          path: |
            settings-validation/
            portfolio-browser-report/
            portfolio-screenshots/
            test-results/
          if-no-files-found: error
          retention-days: 3
