name: Verify launcher selection regression and stage candidate
on:
  push:
    branches: [qa/about-landscape-layout-2026-09-18]
    paths: [.github/workflows/launcher-selection-candidate.yml]
permissions:
  contents: write
jobs:
  candidate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PUPPETEER_SKIP_DOWNLOAD: 'true'
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: c98f911741ada264aa7262aac63a787da2b64105
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
      - run: corepack enable
      - uses: actions/cache@v4
        with:
          path: ~/.yarn/berry/cache
          key: yarn-${{ runner.os }}-${{ hashFiles('yarn.lock') }}
      - run: yarn install --immutable
      - name: Add deterministic selection regressions against unchanged source
        run: |
          python3 - <<'PY'
          import pathlib, subprocess
          assert subprocess.check_output(['git', 'rev-parse', 'HEAD']).decode().strip() == 'c98f911741ada264aa7262aac63a787da2b64105'
          test = pathlib.Path('__tests__/whisker-selection.test.tsx')
          assert not test.exists()
          test.write_text('''import React from 'react';
          import { act, cleanup, fireEvent, render, screen } from '@testing-library/react';
          import WhiskerMenu from '../components/menu/WhiskerMenu';

          describe('launcher delayed autofocus preserves editing', () => {
            beforeEach(() => {
              jest.useFakeTimers();
              jest.spyOn(window, 'requestAnimationFrame').mockImplementation(callback =>
                window.setTimeout(() => callback(0), 0));
              jest.spyOn(window, 'cancelAnimationFrame').mockImplementation(handle =>
                window.clearTimeout(handle));
            });
            afterEach(() => {
              cleanup();
              jest.restoreAllMocks();
              jest.useRealTimers();
            });
            it.each([[0, 10], [3, 3]])('preserves the active selection %i:%i through the autofocus retry', (start, end) => {
              render(<WhiskerMenu />);
              fireEvent.keyDown(window, { key: 'F1', altKey: true });
              act(() => { jest.advanceTimersByTime(20); });
              const input = screen.getByRole('searchbox', { name: 'Search applications' }) as HTMLInputElement;
              fireEvent.change(input, { target: { value: 'Calculator' } });
              input.focus();
              input.setSelectionRange(start, end);
              expect(input).toHaveFocus();
              act(() => { jest.advanceTimersByTime(200); });
              expect(input.selectionStart).toBe(start);
              expect(input.selectionEnd).toBe(end);
              expect(input).toHaveValue('Calculator');
            });
          });
          ''')
          PY
      - name: Require both regressions to fail before the repair
        run: |
          set +e
          yarn jest --runInBand --runTestsByPath __tests__/whisker-selection.test.tsx > /tmp/selection-before.log 2>&1
          result=$?
          set -e
          cat /tmp/selection-before.log
          test "$result" -ne 0
          grep -E 'Tests:.*2 failed' /tmp/selection-before.log
      - name: Preserve user selection when search already owns focus
        run: |
          python3 - <<'PY'
          import pathlib
          path = pathlib.Path('components/menu/WhiskerMenu.tsx')
          text = path.read_text()
          old = '      const activeElement = document.activeElement;\n      if (\n'
          assert text.count(old) == 1, 'Unexpected focus implementation'
          new = '      const activeElement = document.activeElement;\n      // The delayed autofocus retry must not collapse an active selection or\n      // move the caret while a visitor is replacing or editing the query.\n      if (activeElement === input) return;\n      if (\n'
          path.write_text(text.replace(old, new))
          PY
      - name: Require selection and existing focus regressions to pass
        run: yarn jest --runInBand --runTestsByPath __tests__/whisker-selection.test.tsx __tests__/whiskerMenu.test.tsx
      - name: Stage only the reviewed source and regression files
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add components/menu/WhiskerMenu.tsx __tests__/whisker-selection.test.tsx
          git diff --cached --check
          git commit -m 'fix(launcher): preserve active search selection during autofocus retry' -m 'Reproduce both selected-range and caret-position failures before repair, then require all focus regressions to pass. This prevents delayed focus from appending a replacement query in Firefox. No timeouts, assertions, or security settings relaxed.'
          git push origin HEAD:refs/heads/qa/launcher-selection-release-2026-09-18
          git rev-parse HEAD
