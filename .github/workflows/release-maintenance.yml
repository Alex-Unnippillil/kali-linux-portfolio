name: Manual release dependency audit
# The one-time source integrations are complete. Never replay old patches on
# every PR synchronization; their history remains available for review.
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PUPPETEER_SKIP_DOWNLOAD: 'true'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
      - run: corepack enable
      - run: yarn install --immutable
      - run: |
          set -o pipefail
          yarn npm audit --all --recursive --severity high 2>&1 | tee dependency-audit.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dependency-audit
          path: dependency-audit.log
          retention-days: 7
