name: Resolve browser tooling audit
on:
  pull_request:
    paths: ['.github/workflows/security-refresh.yml']
permissions:
  contents: write
concurrency:
  group: portfolio-release-maintenance
  cancel-in-progress: false
jobs:
  refresh:
    if: github.repository == 'Alex-Unnippillil/kali-linux-portfolio' && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'engineering/portfolio-release-2026-09-17'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      PUPPETEER_SKIP_DOWNLOAD: 'true'
      NEXT_TELEMETRY_DISABLED: '1'
      VERCEL_ENV: preview
      NEXT_PUBLIC_VERCEL_ENV: preview
      NODE_OPTIONS: --max-old-space-size=4096
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
      - run: corepack enable
      - name: Refresh supported dependency ranges
        env:
          YARN_ENABLE_IMMUTABLE_INSTALLS: 'false'
        run: |
          set -euo pipefail
          mkdir -p /tmp/final-dependencies
          node <<'JS'
          const fs = require('node:fs');
          const p = JSON.parse(fs.readFileSync('package.json', 'utf8'));
          // pa11y 9's old browser installer includes extract-zip without a fix.
          // Puppeteer 25 removes it. Node 24 supports its ESM interoperability.
          p.resolutions.puppeteer = '^25.8.0';
          fs.writeFileSync('package.json', JSON.stringify(p, null, 2) + '\n');
          JS
          yarn install
          yarn up --recursive dompurify '@babel/core' '@humanfs/node' '@ungap/structured-clone' ajv fflate joi postcss-selector-parser
          yarn dedupe
          yarn install --immutable
          yarn dedupe:check
          yarn npm audit --all --recursive --severity high
          node -e "require('pa11y'); console.log('pa11y and Puppeteer load on Node', process.version)"
      - name: Validate generated dependency graph
        run: |
          set -euo pipefail
          yarn typecheck
          yarn test --maxWorkers=2
          yarn build
      - name: Commit on review branch without overwriting concurrent changes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          branch='engineering/portfolio-release-2026-09-17'
          expected="$(git rev-parse HEAD)"
          git -c credential.helper='!f() { echo username=x-access-token; echo password="$GH_TOKEN"; }; f' fetch origin "$branch"
          test "$(git rev-parse FETCH_HEAD)" = "$expected"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add package.json yarn.lock
          git diff --cached --check
          git commit -m '[deps] remove extract-zip and refresh DOM sanitization dependencies'
          git -c credential.helper='!f() { echo username=x-access-token; echo password="$GH_TOKEN"; }; f' push origin "HEAD:refs/heads/$branch"
      - name: Capture candidate and exact source
        if: always()
        run: |
          mkdir -p /tmp/final-dependencies
          cp package.json yarn.lock /tmp/final-dependencies/
          git rev-parse HEAD > /tmp/final-dependencies/revision.txt
          git archive --format=tar.gz HEAD > /tmp/final-dependencies/source.tar.gz
          tar -czf /tmp/final-dependencies/dependencies.tar.gz node_modules .yarn/install-state.gz
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: final-dependencies
          path: /tmp/final-dependencies
          retention-days: 1
          compression-level: 0
