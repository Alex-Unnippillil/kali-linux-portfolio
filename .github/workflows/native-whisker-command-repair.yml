name: Stage native launcher Command repair
on:
  push:
    branches: [qa/native-apps-source-2026-09-18]
    paths: [.github/workflows/native-whisker-command-repair.yml]
permissions:
  contents: write
jobs:
  stage:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: cea5ffaad86d965a8509353a94cc97b5f6136762
      - name: Verify exact bounded patch and tree
        run: |
          python3 - <<'PY'
          import base64,gzip,hashlib,pathlib,subprocess
          encoded=''
          patch=gzip.decompress(base64.b64decode(encoded,validate=True))
          assert hashlib.sha256(patch).hexdigest()=='55d835a54f0e8ebadae1335d041fcfc84c5dc82da351c3b324fc5cbffab4d9ad'
          pathlib.Path('/tmp/launcher.patch').write_bytes(patch)
          pathlib.Path('.git/info/attributes').write_text('* -text\n')
          subprocess.run(['git','apply','--check','/tmp/launcher.patch'],check=True)
          subprocess.run(['git','apply','/tmp/launcher.patch'],check=True)
          paths=['__tests__/whiskerMenu.test.tsx','components/menu/WhiskerMenu.tsx','tests/portfolio/repository-editor.spec.ts']
          subprocess.run(['git','add','--',*paths],check=True)
          assert subprocess.check_output(['git','diff','--cached','--name-only']).decode().splitlines()==paths
          assert subprocess.check_output(['git','write-tree']).decode().strip()=='e830af4ece672fe103db4799a1512fefa18591dc'
          PY
      - name: Publish isolated source objects without modifying main
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git diff --cached --check
          git commit -m 'fix(launcher): stage reviewed native editing shortcut ownership'
          git push origin HEAD:refs/heads/qa/native-launcher-e830af4
