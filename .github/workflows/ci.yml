name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  NEXT_TELEMETRY_DISABLED: '1'
  PUPPETEER_SKIP_DOWNLOAD: 'true'
  NODE_OPTIONS: --max-old-space-size=4096

jobs:
  checks:
    name: ${{ matrix.check }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        check: [lint, typecheck, test, build, security]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
      # Enable the checked-in Yarn release before any Yarn cache discovery.
      - run: corepack enable
      - uses: actions/cache@v4
        with:
          path: ~/.yarn/berry/cache
          key: yarn-${{ runner.os }}-${{ hashFiles('yarn.lock', '.nvmrc', '.yarnrc.yml') }}
      - run: yarn --version
      - run: yarn install --immutable
      - run: yarn dedupe:check
      - if: matrix.check == 'lint'
        run: yarn lint
      - if: matrix.check == 'typecheck'
        run: yarn typecheck
      - if: matrix.check == 'test'
        run: yarn test --coverage --maxWorkers=2
      - if: matrix.check == 'security'
        run: yarn npm audit --severity high
      - if: matrix.check == 'build'
        run: yarn build
      - if: matrix.check == 'build'
        run: yarn export
      - uses: actions/upload-artifact@v4
        if: always() && matrix.check == 'test'
        with:
          name: coverage
          path: coverage
          if-no-files-found: warn
          retention-days: 7
      - uses: actions/upload-artifact@v4
        if: matrix.check == 'build'
        with:
          name: static-export
          path: out
          if-no-files-found: error
          retention-days: 1

# Vercel's existing Git integration owns preview deployments. Running a second
# CLI deployment here duplicated builds and required an invalid job-level
# secrets condition. No production deployment or secret is used by this CI.
