name: CI
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
env:
  NEXT_TELEMETRY_DISABLED: '1'
  PUPPETEER_SKIP_DOWNLOAD: 'true'
  NODE_OPTIONS: --max-old-space-size=4096
jobs:
  checks:
    name: ${{ matrix.check }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        check: [lockfile, lint, typecheck, test, build, security]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Record validation source
        run: |
          git rev-parse HEAD
          git hash-object .github/workflows/ci.yml hooks/useSettings.tsx __tests__/allowNetwork.test.ts
          git status --porcelain
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
      - run: corepack enable
      - uses: actions/cache@v4
        with:
          path: ~/.yarn/berry/cache
          key: yarn-${{ runner.os }}-${{ hashFiles('yarn.lock', '.nvmrc', '.yarnrc.yml') }}
      - run: yarn --version
      - run: yarn install --immutable
      - if: matrix.check == 'lockfile'
        run: yarn dedupe:check
      - if: matrix.check == 'lint'
        run: yarn lint
      - if: matrix.check == 'typecheck'
        run: yarn typecheck
      - if: matrix.check == 'test'
        run: yarn test --coverage --maxWorkers=2 --json --outputFile=jest-results.json
      - name: Summarize failing tests
        if: always() && matrix.check == 'test'
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          if (!fs.existsSync('jest-results.json')) process.exit(0);
          const result = JSON.parse(fs.readFileSync('jest-results.json', 'utf8'));
          const summary = {
            source: process.env.GITHUB_SHA,
            passed: result.numPassedTests,
            failed: result.numFailedTests,
            pending: result.numPendingTests,
            failures: result.testResults.filter(suite => suite.status === 'failed').map(suite => ({
              file: suite.name.replace(process.env.GITHUB_WORKSPACE + '/', ''),
              message: suite.message,
              tests: suite.assertionResults.filter(test => test.status === 'failed').map(test => ({
                name: test.fullName,
                messages: test.failureMessages,
              })),
            })),
          };
          const text = JSON.stringify(summary, null, 2);
          fs.writeFileSync('jest-failures.json', text);
          fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, '## Jest results\n```json\n' + text + '\n```\n');
          console.log(text);
          NODE
      - if: matrix.check == 'security'
        run: |
          set -o pipefail
          yarn npm audit --all --recursive --severity high 2>&1 | tee dependency-audit.log
      - if: matrix.check == 'build'
        run: yarn build
      - if: matrix.check == 'build'
        run: yarn export
      - uses: actions/upload-artifact@v4
        if: always() && matrix.check == 'security'
        with:
          name: dependency-audit
          path: dependency-audit.log
          retention-days: 7
          if-no-files-found: warn
      - uses: actions/upload-artifact@v4
        if: always() && matrix.check == 'test'
        with:
          name: jest-results
          path: |
            jest-results.json
            jest-failures.json
          if-no-files-found: warn
          retention-days: 7
      - uses: actions/upload-artifact@v4
        if: always() && matrix.check == 'test'
        with:
          name: coverage
          path: coverage
          if-no-files-found: warn
          retention-days: 7
      - uses: actions/upload-artifact@v4
        if: matrix.check == 'build'
        with:
          name: static-export
          path: out
          if-no-files-found: error
          retention-days: 1
# Independent gates prevent a lockfile failure hiding compiler or browser failures.
# Vercel Git integration owns preview deployments.
