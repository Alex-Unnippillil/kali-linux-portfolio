name: Inspect native apps preview failure
on:
  push:
    branches: [qa/native-apps-source-2026-09-18]
    paths: [.github/workflows/native-apps-vercel-diagnostics.yml]
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Read only the known preview build logs
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          python3 - <<'PY'
          import os, pathlib, json, urllib.request, urllib.error
          out=pathlib.Path('/tmp/vercel-diagnostics'); out.mkdir()
          token=os.environ.get('VERCEL_TOKEN','')
          if not token:
              (out/'status.json').write_text(json.dumps({'status':'credential_unavailable','detail':'No VERCEL_TOKEN repository secret was supplied to this diagnostic job.'}))
              print('Build-log inspection unavailable: no configured CI credential. No deployment changed.')
          else:
              url='https://api.vercel.com/v3/deployments/dpl_FTUg6ozCjWhpKkTnxb7Z7jhD7ZYA/events?teamId=team_VQhIbhrweakRT0et6p2YDN5F&follow=0&limit=500'
              try:
                  req=urllib.request.Request(url,headers={'Authorization':'Bearer '+token,'Accept':'application/json'})
                  with urllib.request.urlopen(req,timeout=30) as response:
                      body=response.read(2_000_001)
                      assert len(body)<=2_000_000
                      data=json.loads(body)
                  # Do not emit or archive the credential, including any accidental echo in upstream logs.
                  safe=json.dumps(data,ensure_ascii=False,indent=2).replace(token,'[REDACTED]')
                  (out/'build-events.json').write_text(safe)
                  (out/'status.json').write_text(json.dumps({'status':'retrieved','deployment':'dpl_FTUg6ozCjWhpKkTnxb7Z7jhD7ZYA'}))
                  print('Retrieved build events for the authorized preview; no deployment or security setting changed.')
              except Exception as exc:
                  (out/'status.json').write_text(json.dumps({'status':'unavailable','errorType':type(exc).__name__,'httpStatus':getattr(exc,'code',None)}))
                  print('Build-log inspection unavailable; no deployment changed.')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: native-apps-vercel-diagnostics
          path: /tmp/vercel-diagnostics/
          retention-days: 1
