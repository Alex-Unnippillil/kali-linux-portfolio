name: Refresh reviewed source catalog
on:
  push:
    branches: [fix/youtube-network-default, polish/os-taskbar]
    paths: [.github/workflows/refresh-source-catalog.yml]
permissions:
  contents: read
jobs:
  refresh:
    if: github.repository == 'Alex-Unnippillil/kali-linux-portfolio' && (github.ref == 'refs/heads/fix/youtube-network-default' || github.ref == 'refs/heads/polish/os-taskbar')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
      - name: Regenerate the tracked public-source allowlist and remove this one-time helper
        run: |
          git rm .github/workflows/refresh-source-catalog.yml
          node scripts/generate-repository-snapshot.mjs --catalog
          git add data/repository-source-catalog.json
          git -c core.whitespace=cr-at-eol diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'chore(source): synchronize reviewed deployment catalog with tracked release files'
          git push origin "HEAD:${GITHUB_REF}"
