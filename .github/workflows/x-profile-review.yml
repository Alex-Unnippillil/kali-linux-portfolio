name: X profile isolated source review
on:
  push:
    branches: [qa/x-profile-2026-09-18]
    paths: [.github/workflows/x-profile-review.yml]
permissions:
  contents: read
jobs:
  source:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 8063d70d63da9bb73654c9adb08f71c3afff94d7
          persist-credentials: false
      - name: Package tracked source only
        run: |
          mkdir -p /tmp/x-review
          git rev-parse HEAD > /tmp/x-review/revision.txt
          git archive --format=tar.gz HEAD > /tmp/x-review/source.tar.gz
      - name: Check credential configuration without revealing values
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          node <<'JS'
          const fs = require('node:fs');
          (async () => {
            const result = { managementTokenAvailable: Boolean(process.env.VERCEL_TOKEN), xVariables: [] };
            if (process.env.VERCEL_TOKEN) {
              try {
                const response = await fetch('https://api.vercel.com/v9/projects/prj_UiPM1alzUPGH0LcZIx0LJNg6tbYs/env?teamId=team_VQhIbhrweakRT0et6p2YDN5F&decrypt=false', {
                  headers: { Authorization: `Bearer ${process.env.VERCEL_TOKEN}` }, signal: AbortSignal.timeout(10000)
                });
                result.status = response.status;
                if (response.ok) {
                  const body = await response.json();
                  result.xVariables = (body.envs || []).filter(e => /^(X_|TWITTER_)/.test(e.key)).map(e => ({ key: e.key, target: e.target }));
                }
              } catch { result.checkFailed = true; }
            }
            fs.writeFileSync('/tmp/x-review/configuration.json', JSON.stringify(result, null, 2));
            console.log(JSON.stringify(result));
          })();
          JS
      - uses: actions/upload-artifact@v4
        with:
          name: x-profile-source-review
          path: /tmp/x-review
          retention-days: 1
