name: Validate desktop and phone polish
on:
  pull_request:
    paths: ['.github/workflows/integrate-polish.yml']
permissions:
  contents: write
concurrency:
  group: desktop-polish-source-integration
  cancel-in-progress: false
jobs:
  integrate:
    if: github.repository == 'Alex-Unnippillil/kali-linux-portfolio' && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'engineering/portfolio-release-2026-09-17'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PUPPETEER_SKIP_DOWNLOAD: 'true'
      NEXT_TELEMETRY_DISABLED: '1'
      VERCEL_ENV: preview
      NEXT_PUBLIC_VERCEL_ENV: preview
      NODE_OPTIONS: --max-old-space-size=4096
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Apply checksum-bound source and normalize reviewed line endings
        run: |
          mkdir -p release-evidence
          python3 <<'PY'
          import base64, gzip, hashlib
          from pathlib import Path
          raw = gzip.decompress(base64.b64decode(Path('scripts/desktop-polish.patch.b64').read_text()))
          assert hashlib.sha256(raw).hexdigest() == 'dc47062278d7858388536c0905d744a6c52772468ececb83f795c8045e69e826', 'Transfer checksum mismatch'
          Path('/tmp/desktop-polish.patch').write_bytes(raw)
          PY
          git apply --check /tmp/desktop-polish.patch
          git apply /tmp/desktop-polish.patch
          python3 <<'PY'
          from pathlib import Path
          import hashlib
          path = Path('components/desktop/WindowStateShelf.tsx')
          old = path.read_bytes()
          assert hashlib.sha256(old).hexdigest() == 'fdc634eed84b0b5f23af47f1daeced77ca7a560326f8c61f7d863aed490aebf8'
          new = old.replace(b'\r\n', b'\n')
          assert hashlib.sha256(new).hexdigest() == '272653670e48fd520210033705cc519c95810ddece532320d4a28199e18c974a'
          path.write_bytes(new)
          PY
          git rm scripts/desktop-polish.patch.b64
          git add apps components utils styles tests __tests__ docs
          git diff --cached --check
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
      - run: corepack enable
      - run: yarn install --immutable
      - run: yarn dedupe:check
      - run: yarn lint
      - name: Clean compiler check with original output
        run: |
          set -o pipefail
          node --version > release-evidence/node-version.txt
          yarn tsc --noEmit --incremental false --pretty false 2>&1 | tee release-evidence/typecheck.log
      - name: Unit tests
        run: |
          set -o pipefail
          yarn test --coverage --maxWorkers=2 2>&1 | tee release-evidence/tests.log
      - name: Dependency audit
        run: |
          set -o pipefail
          yarn npm audit --all --recursive --severity high 2>&1 | tee release-evidence/audit.log
      - name: Production build
        run: |
          set -o pipefail
          yarn build 2>&1 | tee release-evidence/build.log
      - name: Commit checked source on the review branch without overwriting changes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          branch='engineering/portfolio-release-2026-09-17'
          expected="$(git rev-parse HEAD)"
          git -c credential.helper='!f() { echo username=x-access-token; echo password="$GH_TOKEN"; }; f' fetch origin "$branch"
          test "$(git rev-parse FETCH_HEAD)" = "$expected" || { echo 'Branch advanced; refusing to overwrite.'; exit 1; }
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m '[desktop] polish phone task switching, calculator focus and persistent notes'
          git -c credential.helper='!f() { echo username=x-access-token; echo password="$GH_TOKEN"; }; f' push origin "HEAD:refs/heads/$branch"
      - run: yarn playwright install --with-deps chromium
      - name: Real desktop and touch interactions
        run: |
          set -o pipefail
          yarn playwright test --config=playwright.portfolio.config.ts 2>&1 | tee release-evidence/browser.log
      - name: Retain exact source and evidence
        if: always()
        run: |
          mkdir -p release-evidence
          git rev-parse HEAD > release-evidence/revision.txt
          git archive --format=tar.gz HEAD > release-evidence/source.tar.gz
          git diff HEAD > release-evidence/uncommitted.patch
          git ls-files apps components utils tests __tests__ | xargs sha256sum > release-evidence/source-hashes.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: polished-desktop-evidence
          path: |
            release-evidence
            portfolio-screenshots
            portfolio-browser-report
            test-results
          retention-days: 7
          if-no-files-found: error
