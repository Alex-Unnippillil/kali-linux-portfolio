name: Read-only source review bundle
on:
  push:
    branches: [qa/deployed-kali-2026-09-17]
permissions:
  contents: read
jobs:
  source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: c59ecb5a3baf95280d0cfc5699ecc26aa1045310
          persist-credentials: false
      - run: git archive --format=tar.gz HEAD > /tmp/review-source.tar.gz
      - uses: actions/upload-artifact@v4
        with:
          name: review-source-c59ecb5
          path: /tmp/review-source.tar.gz
          retention-days: 1
