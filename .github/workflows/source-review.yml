name: Read-only source review bundle
on:
  pull_request:
  push:
    branches: [qa/deployed-kali-2026-09-17]
permissions:
  contents: read
jobs:
  source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: engineering/portfolio-release-2026-09-17
          persist-credentials: false
      - name: Record exact source revision
        run: |
          git rev-parse HEAD | tee /tmp/review-revision.txt
          wc -l components/apps/youtube/index.tsx
          git archive --format=tar.gz HEAD > /tmp/review-source.tar.gz
      - uses: actions/upload-artifact@v4
        with:
          name: review-source-current
          path: |
            /tmp/review-source.tar.gz
            /tmp/review-revision.txt
          retention-days: 1
