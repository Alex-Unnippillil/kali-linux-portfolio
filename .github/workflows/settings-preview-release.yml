name: Finalize Settings preview interactions
on:
  push:
    branches: [feat/settings-control-center]
    paths: [.github/workflows/settings-preview-release.yml]
permissions:
  contents: write
  actions: write
concurrency:
  group: settings-preview-release
  cancel-in-progress: false
jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NEXT_TELEMETRY_DISABLED: '1'
      PUPPETEER_SKIP_DOWNLOAD: 'true'
      NODE_OPTIONS: --max-old-space-size=4096
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
      - run: corepack enable
      - uses: actions/cache@v4
        with:
          path: ~/.yarn/berry/cache
          key: yarn-${{ runner.os }}-${{ hashFiles('yarn.lock', '.nvmrc', '.yarnrc.yml') }}
      - run: yarn install --immutable
      - name: Verify exact reviewed source and add deterministic regressions first
        shell: python
        run: |
          from pathlib import Path
          import subprocess
          def git(*args):
              return subprocess.check_output(['git', *args], text=True).strip()
          assert git('rev-parse', 'HEAD^') == '44e48923fa014063465e1748cd90529210bc15f8'
          for name, expected in {
              'components/screen/navbar.js': '697f98cb568fea07caaff52e62c5cbf7275ef410',
              '__tests__/navbar-running-apps.test.tsx': '15b0c952ea607c96d166124fdad2433012bcc1c1',
              'tests/portfolio/taskbar-operating-system.spec.ts': 'd62647d264396341e425034bdea3ac82cbc0baf6',
          }.items():
              assert git('hash-object', name) == expected, name
          p=Path('__tests__/navbar-running-apps.test.tsx')
          with p.open('a') as f:
              f.write('''
          describe('Taskbar preview interaction retention', () => {
            beforeEach(() => jest.useFakeTimers());
            afterEach(() => { jest.restoreAllMocks(); jest.useRealTimers(); });
            const openPreview = (keyboard = true) => {
              const view = render(<Navbar />);
              act(() => window.dispatchEvent(new CustomEvent('workspace-state', { detail: workspaceEventDetail })));
              const bar = screen.getByRole('navigation', { name: 'Desktop taskbar' });
              const button = within(bar).getByRole('button', { name: 'App One', exact: true });
              if (keyboard) fireEvent.keyDown(button, { key: 'ArrowDown' });
              else fireEvent.mouseEnter(button);
              const preview = screen.getByRole('dialog', { name: 'App One preview' });
              const activate = within(preview).getByRole('button', { name: 'Switch to App One', exact: true });
              return { ...view, button, preview, activate };
            };
            test.each(['button', 'flyout'])('passive %s leave cannot dismiss a keyboard-focused preview', (surface) => {
              const view = openPreview();
              const command = jest.fn();
              window.addEventListener('taskbar-command', command);
              try {
                expect(view.activate).toHaveFocus();
                fireEvent.mouseLeave(surface === 'button' ? view.button : view.preview, { relatedTarget: document.body });
                act(() => { jest.advanceTimersByTime(150); });
                expect(view.preview).toBeInTheDocument();
                expect(view.activate).toHaveFocus();
                fireEvent.click(within(view.preview).getByRole('button', { name: 'Close App One', exact: true }));
                expect(command).toHaveBeenCalledTimes(1);
                expect(command.mock.calls[0][0].detail).toEqual({ appId: 'app1', action: 'close' });
                expect(screen.queryByRole('dialog', { name: 'App One preview' })).toBeNull();
              } finally { window.removeEventListener('taskbar-command', command); view.unmount(); }
            });
            test('pending dismissal rechecks whether the pointer is over the preview', () => {
              const view = openPreview(false);
              try {
                fireEvent.mouseLeave(view.button, { relatedTarget: document.body });
                // Pointer position after asynchronous thumbnail layout, before dismissal.
                jest.spyOn(view.preview, 'matches').mockImplementation(selector => selector === ':hover');
                act(() => { jest.advanceTimersByTime(150); });
                expect(view.preview).toBeInTheDocument();
                fireEvent.keyDown(view.activate, { key: 'Escape' });
                expect(screen.queryByRole('dialog', { name: 'App One preview' })).toBeNull();
              } finally { view.unmount(); }
            });
            test('an unfocused preview still dismisses after the pointer leaves', () => {
              const view = openPreview(false);
              try {
                fireEvent.mouseLeave(view.preview, { relatedTarget: document.body });
                act(() => { jest.advanceTimersByTime(150); });
                expect(screen.queryByRole('dialog', { name: 'App One preview' })).toBeNull();
              } finally { view.unmount(); }
            });
            test('a keyboard preview dismisses when focus moves outside its controls', () => {
              const view = openPreview();
              const outside = document.createElement('button');
              document.body.appendChild(outside);
              try {
                act(() => outside.focus());
                act(() => { jest.advanceTimersByTime(150); });
                expect(screen.queryByRole('dialog', { name: 'App One preview' })).toBeNull();
              } finally { outside.remove(); view.unmount(); }
            });
          });
          ''')
      - name: Prove the regression fails on the unchanged implementation
        run: |
          mkdir -p "$RUNNER_TEMP/settings-validation"
          set +e
          yarn test __tests__/navbar-running-apps.test.tsx --runInBand --testNamePattern='Taskbar preview interaction retention' --json --outputFile="$RUNNER_TEMP/settings-validation/red.json" > "$RUNNER_TEMP/settings-validation/red.log" 2>&1
          result=$?
          set -e
          test "$result" -eq 1
          python - <<'PY'
          import json, os
          from pathlib import Path
          r=json.loads((Path(os.environ['RUNNER_TEMP'])/'settings-validation/red.json').read_text())
          assert r['numRuntimeErrorTestSuites'] == 0, 'A runtime error is not a reproduced assertion'
          assert r['numFailedTests'] == 3 and r['numPassedTests'] == 2, (r['numFailedTests'],r['numPassedTests'])
          print('Reproduced three passive-dismissal failures; both intentional-dismissal cases passed.')
          PY
      - name: Repair the dismissal owner and cover pointer travel in every browser
        shell: python
        run: |
          from pathlib import Path
          p=Path('components/screen/navbar.js'); source=p.read_bytes()
          old=b'''                this.previewHideTimeout = setTimeout(() => {
                                  this.hidePreview();
                          }, 120);'''
          new=b'''                const appId = this.state.preview?.appId;
                          if (!appId) return;
                          this.previewHideTimeout = setTimeout(() => {
                                  this.previewHideTimeout = null;
                                  if (this.state.preview?.appId !== appId) return;
                                  const flyout = this.previewFlyoutRef.current;
                                  const trigger = this.getTaskbarButtonElement(appId);
                                  const focused = document.activeElement;
                                  // Passive pointer/blur events must not dismiss controls still in use.
                                  // Recheck at expiry because thumbnail layout and focus can change.
                                  if ([flyout, trigger].some((element) => element
                                          && (element.contains(focused) || element.matches(':hover')))) {
                                          this.setPreviewLifecycleState('visible', { trigger: 'interaction-retained' });
                                          return;
                                  }
                                  this.hidePreview();
                          }, 120);'''
          assert source.count(old)==1, 'Expected reviewed dismissal block changed'
          p.write_bytes(source.replace(old,new))
          p=Path('tests/portfolio/taskbar-operating-system.spec.ts')
          with p.open('a') as f:
              f.write('''
          test('keyboard preview remains actionable when the pointer leaves before Close', async ({ page }) => {
            await page.setViewportSize({ width: 1440, height: 900 });
            await page.goto('/');
            await expect(page.locator('#about')).toBeVisible();
            await openApp(page, 'Calculator', 'calculator');
            const button = task(page, 'calculator');
            await button.focus();
            await page.keyboard.press('ArrowDown');
            const preview = page.getByRole('dialog', { name: 'Calculator preview', exact: true });
            await expect(preview.getByRole('button', { name: 'Switch to Calculator', exact: true })).toBeFocused();
            await preview.hover();
            await page.mouse.move(1350, 800);
            // Exercise expiry of the actual 120 ms timer without relaxing an existing assertion.
            await page.waitForTimeout(250);
            await expect(preview).toBeVisible();
            await preview.getByRole('button', { name: 'Close Calculator', exact: true }).click();
            await expect(page.locator('#calculator')).toHaveCount(0);
            await expect(preview).toHaveCount(0);
          });
          ''')
      - name: Lint the complete PR scope and commit the candidate without temporary tooling
        run: |
          set -euo pipefail
          env GITHUB_EVENT_NAME=workflow_dispatch GITHUB_BASE_REF=main yarn lint --fix 2>&1 | tee "$RUNNER_TEMP/settings-validation/lint-fix.log"
          git rm .github/workflows/settings-preview-release.yml
          node scripts/generate-repository-snapshot.mjs --catalog
          git -c core.whitespace=cr-at-eol diff --check
          git add components/screen/navbar.js __tests__/navbar-running-apps.test.tsx tests/portfolio/taskbar-operating-system.spec.ts data/repository-source-catalog.json
          git config user.name 'Alex Unnippillil repository automation'
          git config user.email '24538548+Alex-Unnippillil@users.noreply.github.com'
          git commit -m 'fix(taskbar): retain focused or hovered previews through passive dismissal races'
      - name: Validate the exact committed source before publishing
        run: |
          set -euo pipefail
          env GITHUB_EVENT_NAME=workflow_dispatch GITHUB_BASE_REF=main yarn lint 2>&1 | tee "$RUNNER_TEMP/settings-validation/lint.log"
          yarn typecheck 2>&1 | tee "$RUNNER_TEMP/settings-validation/typecheck.log"
          node scripts/generate-repository-snapshot.mjs
          yarn test __tests__/navbar-running-apps.test.tsx __tests__/whisker-selection.test.tsx --runInBand --json --outputFile="$RUNNER_TEMP/settings-validation/green.json" 2>&1 | tee "$RUNNER_TEMP/settings-validation/green.log"
      - name: Fast-forward only the feature branch and run the unchanged full release gates
        env:
          EXPECTED_HEAD: ${{ github.sha }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$(git ls-remote origin refs/heads/feat/settings-control-center | cut -f1)" = "$EXPECTED_HEAD"
          git push origin HEAD:refs/heads/feat/settings-control-center
          test "$(git ls-remote origin refs/heads/feat/settings-control-center | cut -f1)" = "$(git rev-parse HEAD)"
          gh workflow run ci.yml --ref feat/settings-control-center
          gh workflow run portfolio-browser.yml --ref feat/settings-control-center
      - name: Preserve revision-bound evidence
        if: always()
        run: |
          mkdir -p "$RUNNER_TEMP/settings-validation"
          git rev-parse HEAD > "$RUNNER_TEMP/settings-validation/revision.txt"
          git rev-parse HEAD^{tree} > "$RUNNER_TEMP/settings-validation/tree.txt"
          git status --porcelain > "$RUNNER_TEMP/settings-validation/worktree.txt"
          git diff HEAD > "$RUNNER_TEMP/settings-validation/uncommitted.patch"
          git diff HEAD^ HEAD > "$RUNNER_TEMP/settings-validation/committed.patch"
          git archive --format=tar.gz HEAD > "$RUNNER_TEMP/settings-validation/source.tar.gz"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: settings-preview-repair-evidence
          path: ${{ runner.temp }}/settings-validation/
          if-no-files-found: error
          retention-days: 3
