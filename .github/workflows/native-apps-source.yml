name: Native apps source evidence
on:
  push:
    branches: [qa/native-apps-2026-09-18]
    paths: [.github/workflows/native-apps-source.yml]
permissions:
  contents: read
jobs:
  source:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 62f370c8b017906b18ff941fbe5bc392238b0de0
          persist-credentials: false
      - name: Archive exact public source
        run: |
          mkdir -p evidence
          git rev-parse HEAD > evidence/revision.txt
          git rev-parse HEAD^{tree} > evidence/tree.txt
          git archive --format=tar.gz HEAD > evidence/source.tar.gz
      - name: Read public profile without credentials
        run: |
          python3 - <<'PY'
          import pathlib, urllib.request, urllib.error, json
          results=[]
          for name,url in [
            ('x-profile','https://x.com/AUnnippillil'),
            ('x-timeline','https://syndication.twitter.com/srv/timeline-profile/screen-name/AUnnippillil')
          ]:
            try:
              req=urllib.request.Request(url, headers={'User-Agent':'Mozilla/5.0','Accept':'text/html'})
              with urllib.request.urlopen(req,timeout=20) as r:
                body=r.read(2000000)
                pathlib.Path('evidence/'+name+'.html').write_bytes(body)
                results.append({'name':name,'url':url,'status':r.status,'bytes':len(body)})
            except Exception as e:
              results.append({'name':name,'url':url,'error':type(e).__name__,'status':getattr(e,'code',None)})
          pathlib.Path('evidence/public-profile-status.json').write_text(json.dumps(results,indent=2))
          print(json.dumps(results))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: native-apps-source
          path: evidence/
          retention-days: 3
