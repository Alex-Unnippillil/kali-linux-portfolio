name: Format reviewed release
on:
  push:
    branches: [feat/taskbar-os-controls]
    paths: [.github/workflows/format-reviewed-release.yml]
permissions:
  contents: write
  actions: write
concurrency:
  group: finalize-taskbar-release
  cancel-in-progress: false
jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NEXT_TELEMETRY_DISABLED: '1'
      PUPPETEER_SKIP_DOWNLOAD: 'true'
      NODE_OPTIONS: --max-old-space-size=4096
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
      - run: corepack enable
      - uses: actions/cache@v4
        with:
          path: ~/.yarn/berry/cache
          key: yarn-${{ runner.os }}-${{ hashFiles('yarn.lock', '.nvmrc', '.yarnrc.yml') }}
      - run: yarn install --immutable
      - name: Apply reproduced repairs to exact verified source blobs
        shell: python
        run: |
          from pathlib import Path
          import hashlib
          expected = {'utils/settingsStore.js': '2be4c0a48447bc7ed54b6591127ca376a09cfdfb', 'hooks/useSettings.tsx': '26e5d74d8aa1cfba43c373929e537243921f3f07', '__tests__/allowNetwork.test.ts': 'a34279f53b1d2bb5e79d754580240bcf7bef248d', '__tests__/networkSettings.test.ts': '8ef0469e21c259141afa6b041ae91dbc3ee4bacb', 'utils/showDesktopController.ts': '7e73ac6facf25636bb0c683669aed598ff3a7b49', '__tests__/show-desktop-controller.test.ts': '398b3463881c80029a5c09ec594ba85039a2537c', 'docs/taskbar-operating-system.md': 'd6fe8978de54b890ba957a569beacebb211b893f'}
          for name, wanted in expected.items():
              raw = Path(name).read_bytes()
              actual = hashlib.sha1(b'blob ' + str(len(raw)).encode() + b'\0' + raw).hexdigest()
              assert actual == wanted, f'Source changed; reconcile {name} before editing'
          def replace(name, old, new):
              p = Path(name)
              raw = p.read_bytes()
              eol = '\r\n' if b'\r\n' in raw else '\n'
              s = raw.decode().replace('\r\n', '\n')
              assert s.count(old) == 1, (name, s.count(old), old[:80])
              p.write_bytes(s.replace(old, new).replace('\n', eol).encode())
          replace('utils/settingsStore.js', '  allowNetwork: true,', '  // YouTube reads are approved separately; arbitrary hosts remain opt-in.\n  allowNetwork: false,')
          replace('hooks/useSettings.tsx', '        const isAllowed = ["api.github.com"].includes(resolvedUrl.hostname);', '''        const method = init?.method ?? (
            typeof input === "object" && input && "method" in input ? input.method : "GET"
          );
          const isYouTubeRead =
            method.toUpperCase() === "GET" &&
            resolvedUrl.origin === "https://www.googleapis.com" &&
            !resolvedUrl.username &&
            !resolvedUrl.password &&
            /^\\/youtube\\/v3\\/(channels|channelSections|playlists|playlistItems)$/.test(resolvedUrl.pathname);
          const isAllowed = ["api.github.com"].includes(resolvedUrl.hostname) || isYouTubeRead;''')
          p = Path('__tests__/allowNetwork.test.ts')
          s = p.read_text()
          start = s.index('  test("enables networking on a fresh visit')
          end = s.index('\n  test(', start + 5)
          s = s[:start] + '''  test("keeps arbitrary hosts opt-in while approved YouTube reads load immediately", async () => {
            const { result } = renderSettings();
            await waitFor(() => expect(window.localStorage.getItem("allow-network")).toBe("false"));
            expect(result.current.allowNetwork).toBe(false);
            await expect(window.fetch("https://external.com")).rejects.toThrow("Network requests disabled");
            await expect(window.fetch("/api/youtube/directory?channelId=example")).resolves.toBe("ok");
            await expect(window.fetch("/api/youtube/playlist-items?playlistId=example")).resolves.toBe("ok");
            for (const endpoint of ["channels", "channelSections", "playlists", "playlistItems"]) {
              await expect(window.fetch(`https://www.googleapis.com/youtube/v3/${endpoint}?part=snippet`)).resolves.toBe("ok");
            }
            fetchSpy.mockClear();
            for (const url of [
              "http://www.googleapis.com/youtube/v3/playlists",
              "https://www.googleapis.com/drive/v3/files",
              "https://www.googleapis.com.attacker.test/youtube/v3/playlists",
              "https://www.googleapis.com/youtube/v3/playlists/other",
              "https://user:pass@www.googleapis.com/youtube/v3/playlists",
            ]) {
              await expect(window.fetch(url)).rejects.toThrow("Network requests disabled");
            }
            await expect(window.fetch("https://www.googleapis.com/youtube/v3/playlists", { method: "POST" })).rejects.toThrow("Network requests disabled");
            const { Request: NativeRequest } = jest.requireActual<typeof import("undici")>("undici");
            const writeRequest = new NativeRequest("https://www.googleapis.com/youtube/v3/playlists", { method: "POST" });
            await expect(window.fetch(writeRequest as unknown as Request)).rejects.toThrow("Network requests disabled");
            expect(fetchSpy).not.toHaveBeenCalled();
            const readRequest = new NativeRequest("https://www.googleapis.com/youtube/v3/playlists");
            await expect(window.fetch(readRequest as unknown as Request)).resolves.toBe("ok");
          });
          ''' + s[end:]
          needle = '  test("keeps an opt-out after remount and can reconnect without a stale guard", async () => {\n'
          assert s.count(needle) == 1
          s = s.replace(needle, needle + '    window.localStorage.setItem("allow-network", "true");\n')
          p.write_text(s)
          p = Path('__tests__/networkSettings.test.ts')
          s = p.read_text().replace('defaults to enabled', 'defaults to disabled').replace('restores the enabled default', 'restores the disabled default').replace('expect(defaults.allowNetwork).toBe(true)', 'expect(defaults.allowNetwork).toBe(false)').replace('resolves.toBe(true)', 'resolves.toBe(false)').replace('await setAllowNetwork(false);', 'await setAllowNetwork(true);')
          p.write_text(s)
          replace('utils/showDesktopController.ts', 'let operation: { workspace: number; queue: DesktopCommand[]; current?: DesktopCommand } | undefined;', 'let operation: { workspace: number; restoring: boolean; queue: DesktopCommand[]; current?: DesktopCommand } | undefined;')
          replace('utils/showDesktopController.ts', '    operation = undefined;\n    publish();\n  };', '    // A completed restore consumes its capture; later manual minimization is independent.\n    if (operation.restoring) saved.delete(operation.workspace);\n    operation = undefined;\n    publish();\n  };')
          replace('utils/showDesktopController.ts', '      operation = { workspace, queue };', '      operation = { workspace, queue, restoring: view.showing };')
          p = Path('__tests__/show-desktop-controller.test.ts')
          p.write_text(p.read_text() + '''
          test('completed restore cannot resurrect a later manually minimized window', () => {
            const send = jest.fn<void, [DesktopCommand]>();
            const controller = createShowDesktopController(send);
            const publishState = (calculatorMinimized: boolean, aboutMinimized: boolean) =>
              controller.update({ activeWorkspace: 0, runningApps: [
                { id: 'calculator', isMinimized: calculatorMinimized },
                { id: 'about', isMinimized: aboutMinimized, isFocused: true },
              ] });
            publishState(false, false);
            controller.toggle(); publishState(true, false); publishState(true, true);
            controller.toggle(); publishState(false, true); publishState(false, false);
            expect(controller.getSnapshot().showing).toBe(false);
            publishState(true, false);
            expect(controller.getSnapshot()).toEqual({ showing: false, busy: false, available: true });
            send.mockClear();
            controller.toggle(); publishState(true, true);
            expect(send.mock.calls).toEqual([[{ appId: 'about', action: 'minimize' }]]);
            send.mockClear();
            controller.toggle(); publishState(true, false);
            expect(send.mock.calls).toEqual([[{ appId: 'about', action: 'open' }]]);
            controller.reset();
          });
          ''')
          p = Path('docs/taskbar-operating-system.md')
          p.write_text(p.read_text() + '''
          ## Release repairs

          YouTube opens immediately with no network prompt even on a fresh browser or with
          an old saved network-off preference. The optional-network default remains off for
          unrelated apps: same-origin APIs and narrowly scoped HTTPS YouTube GET endpoints
          are allowed, not arbitrary external hosts or write requests.

          A completed Restore windows operation consumes its captured window set, so
          manually minimizing a window afterward does not turn the next Show desktop action
          into an unexpected restore. Targeted tests cover this sequence, approved YouTube
          reads, blocked unrelated hosts and write requests, and asynchronous preview focus.
          ''')
          # These comments referenced a rule absent from the active lint configuration.
          for name in ['__tests__/allowNetwork.test.ts', 'hooks/useSettings.tsx']:
              p = Path(name)
              text = p.read_text()
              text = '\n'.join(line for line in text.split('\n') if '// eslint-disable-next-line @typescript-eslint/unbound-method' not in line)
              p.write_text(text)
          replace('__tests__/allowNetwork.test.ts', 'createElement(SettingsProvider, { children })', 'createElement(SettingsProvider, null, children)')
          replace('components/apps/youtube/index.tsx', 'Choose another collection, enable network access, or refresh the library.', 'Choose another collection or refresh the library.')
          replace('__tests__/youtube.test.tsx', '  await screen.findByRole("heading", { name: "No videos to show yet" });', '  await screen.findByRole("heading", { name: "No videos to show yet" });\n  expect(screen.queryByText(/enable network access/i)).not.toBeInTheDocument();')
      - name: Fix and check the complete PR lint scope, not only the workflow push
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/release-validation"
          env GITHUB_EVENT_NAME=workflow_dispatch GITHUB_BASE_REF=main yarn lint --fix 2>&1 | tee "$RUNNER_TEMP/release-validation/lint-fix.log"
          git rm .github/workflows/format-reviewed-release.yml
          node scripts/generate-repository-snapshot.mjs --catalog
          git -c core.whitespace=cr-at-eol diff --check
          git add -u
          git config user.name 'Alex Unnippillil repository automation'
          git config user.email '24538548+Alex-Unnippillil@users.noreply.github.com'
          git commit -m 'fix(release): finish immediate YouTube networking and desktop restore regressions'
      - name: Validate the committed candidate before publishing it
        run: |
          set -euo pipefail
          env GITHUB_EVENT_NAME=workflow_dispatch GITHUB_BASE_REF=main yarn lint 2>&1 | tee "$RUNNER_TEMP/release-validation/lint.log"
          yarn typecheck 2>&1 | tee "$RUNNER_TEMP/release-validation/typecheck.log"
          node scripts/generate-repository-snapshot.mjs
          node --test tests/node/showcase-scripts.test.mjs 2>&1 | tee "$RUNNER_TEMP/release-validation/native.log"
          yarn test __tests__/showcase-scripts.test.ts __tests__/youtube-library-lifecycle.test.tsx __tests__/youtube.test.tsx __tests__/navbar-running-apps.test.tsx __tests__/show-desktop-controller.test.ts __tests__/networkSettings.test.ts __tests__/allowNetwork.test.ts --runInBand 2>&1 | tee "$RUNNER_TEMP/release-validation/targeted.log"
      - name: Fast-forward the reviewed feature branch and dispatch its normal gates
        env:
          EXPECTED_HEAD: ${{ github.sha }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$(git ls-remote origin refs/heads/feat/taskbar-os-controls | cut -f1)" = "$EXPECTED_HEAD"
          git push origin HEAD:refs/heads/feat/taskbar-os-controls
          test "$(git ls-remote origin refs/heads/feat/taskbar-os-controls | cut -f1)" = "$(git rev-parse HEAD)"
          gh workflow run ci.yml --ref feat/taskbar-os-controls
          gh workflow run portfolio-browser.yml --ref feat/taskbar-os-controls
      - name: Preserve exact source and native diagnostics
        if: always()
        run: |
          mkdir -p "$RUNNER_TEMP/release-validation"
          git rev-parse HEAD > "$RUNNER_TEMP/release-validation/source-revision.txt"
          git rev-parse HEAD^{tree} > "$RUNNER_TEMP/release-validation/source-tree.txt"
          git status --porcelain > "$RUNNER_TEMP/release-validation/worktree.txt"
          git diff HEAD > "$RUNNER_TEMP/release-validation/uncommitted.patch"
          git diff HEAD^ HEAD > "$RUNNER_TEMP/release-validation/committed.patch"
          git archive --format=tar.gz HEAD > "$RUNNER_TEMP/release-validation/source.tar.gz"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: release-repair-evidence
          path: ${{ runner.temp }}/release-validation/
          if-no-files-found: error
          retention-days: 3
